        - sellerRole

    CreateProductRequest:
      type: object
      required:
        - kind
        - title
        - category
        - price
        - unit
        - quantity
        - county
        - description
      properties:
        kind:
          type: string
          enum: [ input, service ]
          example: input
        title:
          type: string
          minLength: 2
          example: Hybrid maize seed
        category:
          type: string
          minLength: 2
          example: Seeds
        price:
          type: number
          minimum: 0
          example: 450
        unit:
          type: string
          minLength: 1
          example: kg
        quantity:
          type: integer
          minimum: 0
          description: Stock count available
          example: 75
        county:
          type: string
          minLength: 2
          example: Nakuru
        description:
          type: string
          minLength: 12
          example: Drought-tolerant maize seed suited to mid-altitude regions.

    OrderItemInput:
      type: object
      required:
        - id
        - type
        - quantity
      properties:
        id:
          type: integer
          description: Listing ID
          example: 1
        type:
          type: string
          enum: [ produce, product ]
          example: produce
        quantity:
          type: integer
          minimum: 1
          example: 10

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: '#/components/schemas/OrderItemInput'

    OrderItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Fresh tomatoes
        unit:
          type: string
          example: kg
        price:
          type: number
          example: 85
        quantity:
          type: integer
          example: 10
        sellerId:
          type: integer
          example: 1
        sellerName:
          type: string
          example: Grace Wanjiku

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        buyerId:
          type: integer
          example: 2
        buyerName:
          type: string
          example: Peter Otieno
        buyerPhone:
          type: string
          example: '0722 610 445'
        total:
          type: number
          example: 3250
        status:
          type: string
          enum: [ pending, confirmed, fulfilled, cancelled ]
          example: pending
        createdAt:
          type: string
          example: '2026-08-24 17:35:00'
        sellers:
          type: array
          description: All portions for buyers; only the authenticated seller portion for sellers.
          items:
            type: object
            properties:
              sellerId:
                type: integer
              status:
                type: string
                enum: [ pending, confirmed, fulfilled, cancelled ]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ confirmed, fulfilled, cancelled ]
          example: confirmed

    InventoryStatus:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Hybrid maize seed
        stock:
          type: integer
          example: 75
        unit:
          type: string
          example: kg
        inStock:
          type: boolean
          example: true
        lastUpdated:
          type: string
          example: '2026-08-24 17:30:00'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: The request could not be completed.
        fields:
          type: object
          additionalProperties:
            type: string
          example:
            email: Enter a valid email address.
        consultationId:
          type: integer
      required:
        - message
    FarmLocationInput:
      type: object
      required:
        - subCounty
        - farmLocation
      properties:
        subCounty:
          type: string
          minLength: 2
          maxLength: 1000
        farmLocation:
          type: string
          minLength: 3
          maxLength: 1000
        landmarks:
          type: string
          maxLength: 1000
        visitInstructions:
          type: string
          maxLength: 1000
        farmSizeAcres:
          type: number
          minimum: 0
          exclusiveMinimum: true
          nullable: true
    SkillBridgeSkill:
      type: object
      required:
        - id
        - name
        - category
      properties:
        id: &a4
          type: integer
        name: &a3
          type: string
        category: *a3
        offeredBy: *a4
    SkillBridgeReviews:
      type: object
      required:
        - rating
        - reviewCount
        - completedSessions
      properties:
        rating:
          type: number
        reviewCount:
          type: integer
          minimum: 0
        completedSessions:
          type: integer
          minimum: 0
    SkillBridgeSlot:
      type: object
      required:
        - date
        - startTime
        - durationMinutes
      properties:
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
        durationMinutes:
          type: integer
          minimum: 1
    Consultation:
      type: object
      required:
        - id
        - expertId
        - expertName
        - topic
        - date
        - submissionState
        - requestId
        - partnerStatus
        - createdAt
      properties:
        id: &a5
          type: integer
        expertId: *a5
        expertName: &a6
          type: string
        topic: *a6
        date:
          type: string
          format: date-time
        submissionState:
          type: string
          enum:
            - submitting
            - submitted
            - unknown
            - rejected
        requestId:
          type: integer
          nullable: true
        partnerStatus:
          type: string
          nullable: true
        createdAt: *a6
