  /api/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Update order status
      description: |
        Updates the fulfillment workflow status of an order.
        - **Seller**: updates only their portion, pending -> confirmed -> fulfilled, or cancels a pending/confirmed portion. Invalid transitions return 409.
        - Aggregate buyer status is cancelled if all portions are cancelled, fulfilled if all non-cancelled portions are fulfilled, pending if all portions are pending, and confirmed otherwise.
        - Cancellation does not restore inventory. Existing orders inherit their historical shared status for each seller portion.
        - **Buyer**: can cancel the whole order only while every seller portion is pending; otherwise returns 403.
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: confirmed
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - unauthorized status transition or user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Seller portion cannot make the requested status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
