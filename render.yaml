services:
  - type: web
    name: agroconnect-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_KEYS
        sync: false
      - key: SKILLBRIDGE_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
