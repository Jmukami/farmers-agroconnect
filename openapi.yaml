openapi: 3.0.0
info:
  title: AgroConnect API
  description: >
    AgroConnect is a full-stack digital agricultural marketplace and service platform connecting Kenyan farmers, farm
    input/service suppliers, and buyers.


    JSON write requests require an object body and Content-Type application/json.

    Missing or malformed bodies return 400, unsupported media types return 415,

    and bodies above 100 KB return 413. Numeric fields require JSON numbers.

    AgroConnect timestamps are UTC. SkillBridge availability contains timezone-free wall-clock values; its timezone is
    unconfirmed. County and category filters are case-sensitive.


    This OpenAPI specification defines the REST API contract for the AgroConnect platform, serving both internally
    and  our downstream integration partners: **Campus Hub** / Team 7).
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AgroConnect Team (Team 6)
    url: https://github.com/Jmukami/farmers-agroconnect

servers:
  - url: https://farmers-agroconnect.onrender.com
    description: Hosted API on Render; endpoint paths already include /api
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Authentication
    description: User registration, login, and session validation
  - name: Farmers
    description: Public farmer directory and contact discovery (Downstream for Campus Hub Need 1 & 2)
  - name: Produce Listings
    description: Farmer-owned agricultural harvest produce marketplace
  - name: Products & Services
    description: Farm inputs, equipment, and agricultural service catalog (Downstream for Campus Hub Need 3 & 4)
  - name: Orders
    description: Multi-item purchasing, transactional checkout, and order status workflow
  - name: SkillBridge
    description: Agricultural expert discovery and consultation requests
  - name: Health

paths:
  /api/skillbridge/experts:
    get:
      tags:
        - SkillBridge
      summary: Discover agricultural experts from SkillBridge
      description: Agricultural experts matched against the Agriculture skill catalogue. Estate and sort/coordinates are
        forwarded to SkillBridge. Search and agricultural skill matching are local. Results use the requested sort.
      operationId: discoverSkillBridgeExperts
      security: []
      parameters:
        - name: skill
          in: query
          schema:
            type: string
          description: Agricultural skill name, matched case-insensitively.
        - name: estate
          in: query
          schema:
            type: string
          description: Estate passed to SkillBridge; upstream matching semantics apply.
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive search of name, biography and skills.
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - rating
              - proximity
            default: rating
        - name: lat
          in: query
          description: Both coordinates are required for proximity sorting; zero is valid.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          description: Both coordinates are required for proximity sorting; zero is valid.
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - rating
              - proximity
            default: rating
        - name: lat
          in: query
          description: Both coordinates are required for proximity sorting; zero is valid.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          description: Both coordinates are required for proximity sorting; zero is valid.
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Experts, agricultural skills and estate options from the returned upstream expert set.
          content:
            application/json:
              schema:
                type: object
                required:
                  - experts
                  - skills
                  - estates
                properties:
                  experts:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkillBridgeExpert"
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkillBridgeSkill"
                  estates:
                    type: array
                    items:
                      type: string
        "400":
          description: Invalid request, missing upstream resource, partner limit, invalid response or partner unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invalid request, missing upstream resource, partner limit, invalid response or partner unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Invalid request, missing upstream resource, partner limit, invalid response or partner unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Invalid request, missing upstream resource, partner limit, invalid response or partner unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Invalid request, missing upstream resource, partner limit, invalid response or partner unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/skillbridge/experts/{id}:
    get:
      tags: [ SkillBridge ]
      summary: View an agricultural expert, reviews and availability
      description: Agricultural expert with independent review and availability sections. Failed optional sections are null
        and produce sanitized operational logs. Slot timezone is unconfirmed; consultation submission requires an
        explicit timestamp.
      operationId: getSkillBridgeExpert
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Expert profile with optional reviews and availability.
          content:
            application/json:
              schema:
                type: object
                required: [ expert, reviews, availability ]
                properties:
                  expert: { $ref: '#/components/schemas/SkillBridgeExpert' }
                  reviews:
                    type: object
                    nullable: true
                    required: [ rating, reviewCount, completedSessions ]
                    properties:
                      rating: { type: number }
                      reviewCount: { type: integer }
                      completedSessions: { type: integer }
                  availability:
                    type: array
                    nullable: true
                    items:
                      type: object
                      required: [ date, startTime, durationMinutes ]
                      properties:
                        date: { type: string, format: date }
                        startTime: { type: string, example: '09:00:00' }
                        durationMinutes: { type: integer, minimum: 1 }
        '400':
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: Expert missing or has no agricultural skills; JSON contains message.
        '502':
          description: Partner rate limit, invalid response or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '503':
          description: Partner rate limit, invalid response or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Partner rate limit, invalid response or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account
      description: Creates a user account with role `farmer`, `buyer`, or `supplier` and returns the user profile with a JWT
        session token.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Conflict - email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error on input fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in with credentials
      description: Authenticates user credentials using email and password, returning user profile details and a JWT session token.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorised - invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user
      description: Retrieves profile details for the user session associated with the provided Bearer token.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorised - missing, expired, or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/farmers:
    get:
      tags:
        - Farmers
      summary: List registered farmer profiles
      description: Retrieves a public directory of all registered farmers, sorted alphabetically by name. Used by downstream
        consumers for discovery.
      operationId: listFarmers
      security: []
      responses:
        '200':
          description: List of farmers
          content:
            application/json:
              schema:
                type: object
                properties:
                  farmers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Farmer'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/farmers/{id}:
    get:
      tags:
        - Farmers
      summary: Get single farmer profile by ID
      description: |
        Retrieves  public profile and contact details for a specific farmer.
        **Downstream Mapping**: Fulfills Campus Hub Need 1 (verify member identities & register memberships).
      operationId: getFarmerById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique user ID of the farmer
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Farmer profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  farmer:
                    $ref: '#/components/schemas/Farmer'
        '404':
          description: Farmer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/produce:
    get:
      tags:
        - Produce Listings
      summary: Browse and filter produce listings
      description: Returns a list of active farmer harvest listings, sorted by newest first. Supports optional keyword search,
        county, and category filtering.
      operationId: listProduce
      security: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search term matched against produce title and description
          schema:
            type: string
            example: tomatoes
        - name: county
          in: query
          required: false
          description: Filter by Kenyan county
          schema:
            type: string
            example: Nakuru
        - name: category
          in: query
          required: false
          description: Filter by produce category (e.g., Vegetables, Cereals)
          schema:
            type: string
            example: Vegetables
      responses:
        '200':
          description: Array of produce listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProduceListing'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Produce Listings
      summary: Create a produce listing
      description: Publishes a new harvest produce listing. Restricted to authenticated users with the `farmer` role.
      operationId: createProduce
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduceRequest'
      responses:
        '201':
          description: Produce listing created
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/ProduceListing'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - only farmer accounts can post produce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/produce/{id}:
    put:
      tags:
        - Produce Listings
      summary: Update a produce listing
      description: Updates an existing harvest listing. Restricted to the listing owner.
      operationId: updateProduce
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Produce listing ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduceRequest'
      responses:
        '200':
          description: Produce listing updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/ProduceListing'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not listing owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Produce Listings
      summary: Delete a produce listing
      description: Removes an existing harvest listing from the marketplace. Restricted to the listing owner.
      operationId: deleteProduce
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Produce listing ID
          schema:
            type: integer
      responses:
        '204':
          description: Produce listing deleted successfully
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not listing owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Produce Listings
      summary: Get produce listing by ID
      operationId: getProduceById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - listing
                properties:
                  listing:
                    $ref: "#/components/schemas/ProduceListing"
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found or not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/products:
    get:
      tags:
        - Products & Services
      summary: List farm inputs and services
      description: |
        Retrieves a catalog of farm inputs and agricultural services with stock levels.
        **Downstream Mapping**: Fulfills Campus Hub Need 3 (read product information) and Need 4 (access inventory details).
      operationId: listProducts
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Filter by offering type
          schema:
            type: string
            enum: [ input, service ]
        - name: search
          in: query
          required: false
          description: Keyword search in title and description
          schema:
            type: string
            example: seeds
        - name: county
          in: query
          required: false
          description: Filter by county
          schema:
            type: string
            example: Nakuru
        - name: category
          in: query
          required: false
          description: Filter by category (e.g., Seeds, Fertilizer, Machinery)
          schema:
            type: string
            example: Seeds
      responses:
        '200':
          description: Array of product and service listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Products & Services
      summary: Create a product or service offering
      description: Publishes a new farm input or agricultural service offering. Restricted to authenticated users with the
        `supplier` role.
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Offering created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - supplier role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/products/{id}:
    put:
      tags:
        - Products & Services
      summary: Update a product or service offering
      description: Updates details, pricing, or stock of an existing offering. Restricted to the offering owner.
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product listing ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: Offering updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not offering owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Products & Services
      summary: Delete a product or service offering
      description: Deletes an offering from the platform catalog. Restricted to the offering owner.
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product listing ID
          schema:
            type: integer
      responses:
        '204':
          description: Offering deleted successfully
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not offering owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Products & Services
      summary: Get product offering by ID
      operationId: getProductById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - listing
                properties:
                  listing:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Invalid resource ID or JSON request body, oversized body or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found or not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders:
    post:
      tags:
        - Orders
      summary: Place a new order
      description: |
        Creates a multi-item purchase order across produce and/or products.
        Executes within a database transaction, dynamically attributing line items to each seller and decrementing available inventory stock.
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      total:
                        type: number
                        example: 3250
                      status:
                        type: string
                        example: pending
                      createdAt:
