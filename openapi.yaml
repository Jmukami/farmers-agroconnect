openapi: 3.0.0
info:
  title: AgroConnect API
  description: |
    AgroConnect is a full-stack digital agricultural marketplace and service platform connecting Kenyan farmers, farm input/service suppliers, and buyers.
    
    This OpenAPI specification defines the REST API contract for the AgroConnect platform, serving both internally and  our downstream integration partners: **Campus Hub** / Team 7).
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AgroConnect Team (Team 6)
    url: https://github.com/Jmukami/farmers-agroconnect

tags:
  - name: Authentication
    description: User registration, login, and session validation
  - name: Farmers
    description: Public farmer directory and contact discovery (Downstream for Campus Hub Need 1 & 2)
  - name: Produce Listings
    description: Farmer-owned agricultural harvest produce marketplace
  - name: Products & Services
    description: Farm inputs, equipment, and agricultural service catalog (Downstream for Campus Hub Need 3 & 4)
  - name: Orders
    description: Multi-item purchasing, transactional checkout, and order status workflow
  - name: Proposed Endpoints (Campus Hub)
    description: Planned additions/enhancements to fulfill Campus Hub downstream requirements

paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account
      description: Creates a user account with role `farmer`, `buyer`, or `supplier` and returns the user profile with a JWT session token.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Conflict - email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error on input fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in with credentials
      description: Authenticates user credentials using email and password, returning user profile details and a JWT session token.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorised - invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user
      description: Retrieves profile details for the user session associated with the provided Bearer token.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorised - missing, expired, or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/farmers:
    get:
      tags:
        - Farmers
      summary: List registered farmer profiles
      description: Retrieves a public directory of all registered farmers, sorted alphabetically by name. Used by downstream consumers for discovery.
      operationId: listFarmers
      security: []
      responses:
        '200':
          description: List of farmers
          content:
            application/json:
              schema:
                type: object
                properties:
                  farmers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Farmer'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/farmers/{id}:
    get:
      tags:
        - Farmers
      summary: Get single farmer profile by ID
      description: |
        Retrieves  public profile and contact details for a specific farmer.
        **Downstream Mapping**: Fulfills Campus Hub Need 1 (verify member identities & register memberships).
      operationId: getFarmerById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique user ID of the farmer
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Farmer profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  farmer:
                    $ref: '#/components/schemas/Farmer'
        '404':
          description: Farmer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/produce:
    get:
      tags:
        - Produce Listings
      summary: Browse and filter produce listings
      description: Returns a list of active farmer harvest listings, sorted by newest first. Supports optional keyword search, county, and category filtering.
      operationId: listProduce
      security: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search term matched against produce title and description
          schema:
            type: string
            example: tomatoes
        - name: county
          in: query
          required: false
          description: Filter by Kenyan county
          schema:
            type: string
            example: Nakuru
        - name: category
          in: query
          required: false
          description: Filter by produce category (e.g., Vegetables, Cereals)
          schema:
            type: string
            example: Vegetables
      responses:
        '200':
          description: Array of produce listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProduceListing'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Produce Listings
      summary: Create a produce listing
      description: Publishes a new harvest produce listing. Restricted to authenticated users with the `farmer` role.
      operationId: createProduce
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduceRequest'
      responses:
        '201':
          description: Produce listing created
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/ProduceListing'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - only farmer accounts can post produce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/produce/{id}:
    put:
      tags:
        - Produce Listings
      summary: Update a produce listing
      description: Updates an existing harvest listing. Restricted to the listing owner.
      operationId: updateProduce
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Produce listing ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProduceRequest'
      responses:
        '200':
          description: Produce listing updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/ProduceListing'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not listing owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Produce Listings
      summary: Delete a produce listing
      description: Removes an existing harvest listing from the marketplace. Restricted to the listing owner.
      operationId: deleteProduce
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Produce listing ID
          schema:
            type: integer
      responses:
        '204':
          description: Produce listing deleted successfully
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not listing owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products:
    get:
      tags:
        - Products & Services
      summary: List farm inputs and services
      description: |
        Retrieves a catalog of farm inputs and agricultural services with stock levels.
        **Downstream Mapping**: Fulfills Campus Hub Need 3 (read product information) and Need 4 (access inventory details).
      operationId: listProducts
      security: []
      parameters:
        - name: kind
          in: query
          required: false
          description: Filter by offering type
          schema:
            type: string
            enum: [input, service]
        - name: search
          in: query
          required: false
          description: Keyword search in title and description
          schema:
            type: string
            example: seeds
        - name: county
          in: query
          required: false
          description: Filter by county
          schema:
            type: string
            example: Nakuru
        - name: category
          in: query
          required: false
          description: Filter by category (e.g., Seeds, Fertilizer, Machinery)
          schema:
            type: string
            example: Seeds
      responses:
        '200':
          description: Array of product and service listings
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Products & Services
      summary: Create a product or service offering
      description: Publishes a new farm input or agricultural service offering. Restricted to authenticated users with the `supplier` role.
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Offering created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - supplier role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{id}:
    put:
      tags:
        - Products & Services
      summary: Update a product or service offering
      description: Updates details, pricing, or stock of an existing offering. Restricted to the offering owner.
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product listing ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: Offering updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not offering owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Products & Services
      summary: Delete a product or service offering
      description: Deletes an offering from the platform catalog. Restricted to the offering owner.
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product listing ID
          schema:
            type: integer
      responses:
        '204':
          description: Offering deleted successfully
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not offering owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders:
    post:
      tags:
        - Orders
      summary: Place a new order
      description: |
        Creates a multi-item purchase order across produce and/or products.
        Executes within a database transaction, dynamically attributing line items to each seller and decrementing available inventory stock.
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      total:
                        type: number
                        example: 3250
                      status:
                        type: string
                        example: pending
                      createdAt:
                        type: string
                        example: '2026-08-24 17:35:00'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - insufficient inventory for one or more items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error - empty items list or attempt to purchase self-owned item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Orders
      summary: List user orders
      description: Retrieves all orders where the authenticated user is either the buyer or one of the line-item sellers.
      operationId: listOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user orders with line items
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Update order status
      description: |
        Updates the fulfillment workflow status of an order.
        - **Seller**: can transition `pending` -> `confirmed` -> `fulfilled`.
        - **Buyer**: can transition `pending` -> `cancelled`.
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: confirmed
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - unauthorized status transition or user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # PROPOSED ENDPOINTS (PLANNED FOR CAMPUS HUB REQUIREMENTS - ENDPOINT_LIST.MD SECTION 2)
  # ---------------------------------------------------------------------------

  /api/farmers/{id}/farm-location:
    get:
      tags:
        - Proposed Endpoints (Campus Hub)
      summary: "[PROPOSED] Get farm physical location & visit instructions"
      description: |
        *Planned endpoint to fulfill Campus Hub Need 2 (access locations of members' farms to facilitate farm visits).*
        Returns specific farm geographic location, sub-county/ward, landmarks, acreage, and farm visit contact instructions.
      operationId: getFarmerFarmLocation
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Farmer user ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Detailed farm location and visitation guidelines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmLocation'
        '404':
          description: Farmer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{id}/detail:
    get:
      tags:
        - Proposed Endpoints (Campus Hub)
      summary: "[PROPOSED] Get single product offering by ID"
      description: |
        *Planned endpoint to fulfill Campus Hub Need 3 (read farming product information) and Need 4 (access inventory details).*
        Returns complete product metadata, specifications, live stock, and supplier contact information for dedicated website display.
      operationId: getProductDetailById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product offering ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Single product offering details
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/produce/{id}/detail:
    get:
      tags:
        - Proposed Endpoints (Campus Hub)
      summary: "[PROPOSED] Get single harvest produce listing by ID"
      description: |
        *Planned endpoint to fulfill Campus Hub Need 3 (product information) and Need 4 (available quantity).*
        Returns complete produce listing details and seller contact information for dedicated website display.
      operationId: getProduceDetailById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Produce listing ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Single harvest produce listing details
          content:
            application/json:
              schema:
                type: object
                properties:
                  produce:
                    $ref: '#/components/schemas/ProduceListing'
        '404':
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{id}/inventory:
    get:
      tags:
        - Proposed Endpoints (Campus Hub)
      summary: "[PROPOSED] Dedicated real-time inventory check"
      description: |
        *Planned endpoint to fulfill Campus Hub Need 4 (access inventory details and stock levels).*
        Fast lightweight query returning current stock count and availability status for a product.
      operationId: getProductInventory
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Product ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Real-time inventory status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryStatus'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pass standard JWT session token received from `/api/auth/login` or `/api/auth/register`.

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Grace Wanjiku
        email:
          type: string
          format: email
          example: grace@agroconnect.local
        phone:
          type: string
          example: '0712 555 818'
        county:
          type: string
          example: Nakuru
        role:
          type: string
          enum: [farmer, buyer, supplier]
          example: farmer
        focus:
          type: string
          example: Maize and horticulture
        createdAt:
          type: string
          example: '2026-08-24 17:30:00'

    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - phone
        - county
        - role
        - password
      properties:
        fullName:
          type: string
          minLength: 2
          example: Grace Wanjiku
        email:
          type: string
          format: email
          example: grace@agroconnect.local
        phone:
          type: string
          minLength: 9
          example: '0712 555 818'
        county:
          type: string
          minLength: 2
          example: Nakuru
        role:
          type: string
          enum: [farmer, buyer, supplier]
          example: farmer
        password:
          type: string
          format: password
          minLength: 8
          example: agroconnect_secure
        focus:
          type: string
          example: Maize and horticulture

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: grace@agroconnect.local
        password:
          type: string
          format: password
          example: agroconnect

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    Farmer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Grace Wanjiku
        phone:
          type: string
          example: '0712 555 818'
        county:
          type: string
          example: Nakuru
        focus:
          type: string
          example: Maize and horticulture
        createdAt:
          type: string
          example: '2026-08-24 17:30:00'

    FarmLocation:
      type: object
      properties:
        farmerId:
          type: integer
          example: 1
        farmerName:
          type: string
          example: Grace Wanjiku
        county:
          type: string
          example: Nakuru
        subCounty:
          type: string
          example: Naivasha
        farmLocation:
          type: string
          example: Subukia Valley, Plot 42
        landmarks:
          type: string
          example: Near Subukia Secondary School
        visitContactPhone:
          type: string
          example: '0712 555 818'
        farmSizeAcres:
          type: number
          example: 5

    ProduceListing:
      type: object
      properties:
        id:
          type: integer
          example: 1
        ownerId:
          type: integer
          example: 1
        title:
          type: string
          example: Fresh tomatoes
        category:
          type: string
          example: Vegetables
        price:
          type: number
          example: 85
        unit:
          type: string
          example: kg
        quantity:
          type: integer
          example: 320
        county:
          type: string
          example: Nakuru
        description:
          type: string
          example: Firm, graded field tomatoes ready for pickup or delivery.
        availableFrom:
          type: string
          example: Available now
        createdAt:
          type: string
          example: '2026-08-24 17:30:00'
        updatedAt:
          type: string
          example: '2026-08-24 17:30:00'
        sellerName:
          type: string
          example: Grace Wanjiku
        sellerPhone:
          type: string
          example: '0712 555 818'
        sellerRole:
          type: string
          example: farmer

    CreateProduceRequest:
      type: object
      required:
        - title
        - category
        - price
        - unit
        - quantity
        - county
        - description
      properties:
        title:
          type: string
          minLength: 2
          example: Fresh tomatoes
        category:
          type: string
          minLength: 2
          example: Vegetables
        price:
          type: number
          minimum: 0
          example: 85
        unit:
          type: string
          minLength: 1
          example: kg
        quantity:
          type: integer
          minimum: 0
          example: 320
