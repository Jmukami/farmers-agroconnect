components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pass standard JWT session token received from `/api/auth/login` or `/api/auth/register`.

  schemas:
    SkillBridgeExpert:
      type: object
      required: [ id, name, estate, rating, skills ]
      properties:
        id: { type: integer }
        name: { type: string }
        estate: { type: string }
        rating: { type: number }
        bio: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        skills:
          type: array
          items: { type: string }
        distanceKm:
          type: number
          minimum: 0
          description: Returned for proximity sorting
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fullName:
          type: string
          example: Grace Wanjiku
        email:
          type: string
          format: email
          example: grace@agroconnect.local
        phone:
          type: string
          example: '0712 555 818'
        county:
          type: string
          example: Nakuru
        role:
          type: string
          enum: [ farmer, buyer, supplier ]
          example: farmer
        focus:
          type: string
          example: Maize and horticulture
        createdAt:
          type: string
          example: '2026-08-24 17:30:00'

    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - phone
        - county
        - role
        - password
      properties:
        fullName:
          type: string
          minLength: 2
          example: Grace Wanjiku
        email:
