<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#244b35" />
    <title>AgroConnect API Reference</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      body { background: #f7f8f5; color: #24312a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #redoc { min-height: 100vh; }
      .loading { max-width: 760px; margin: 12vh auto; padding: 32px; color: #496052; }
      .loading h1 { margin: 0 0 8px; color: #244b35; font-size: 1.5rem; }
      .loading p { line-height: 1.6; }
      .loading code { padding: 2px 5px; border-radius: 4px; background: #edf1eb; }
    </style>
    <script src="https://cdn.redocly.com/redoc/v2.5.4/bundles/redoc.standalone.js" integrity="sha384-w447zOpYfw/1Tv/5AK9NfHTlQIqE3RVR6KY62jCyy9zNDgO64cMwGGP1Fj0zJVf5" crossorigin="anonymous"></script>
  </head>
  <body>
    <main id="redoc">
      <section class="loading">
        <h1>AgroConnect API Reference</h1>
        <p>Loading the API contract from <code>openapi.yaml</code>…</p>
        <p>Serve this page from the project root, for example at <code>http://localhost:5173/redoc-static.html</code>.</p>
      </section>
    </main>
    <script>
      Redoc.init(
        './openapi.yaml',
        {
          hideDownloadButton: false,
          requiredPropsFirst: true,
          sortPropsAlphabetically: false,
          theme: {
            colors: {
              primary: { main: '#2e6b43' },
              success: { main: '#2e6b43' },
              text: { primary: '#24312a', secondary: '#59665d' },
              http: {
                get: '#25815a',
                post: '#2966a3',
                put: '#aa7515',
                patch: '#7654a5',
                delete: '#b44b43'
              }
            },
            typography: {
              fontFamily: 'Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
              headings: { fontFamily: 'inherit', fontWeight: '650' },
              code: { fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' }
            },
            sidebar: { backgroundColor: '#f1f4ef', textColor: '#34483b', activeTextColor: '#2e6b43' }
          }
        },
        document.getElementById('redoc')
      ).catch((error) => {
        document.getElementById('redoc').innerHTML = '<section class="loading"><h1>Could not load the API contract</h1><p>Open this page through the local project server and confirm that <code>openapi.yaml</code> is available beside it.</p></section>';
        console.error('ReDoc failed to load openapi.yaml:', error);
      });
    </script>
  </body>
</html>
